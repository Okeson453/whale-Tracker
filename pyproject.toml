[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whale-tracker"
version = "0.1.0"
description = "Solana whale-copy-trading alert and execution bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
    "base58>=2.1",
    "solders>=0.21",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = [
    "app", "app.ingestion", "app.enrichment", "app.screening",
    "app.notification", "app.execution", "app.state", "app.utils",
    "app.analytics", "app.simulation", "app.monitoring",
    "scripts",
    "tests", "tests.fixtures"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
